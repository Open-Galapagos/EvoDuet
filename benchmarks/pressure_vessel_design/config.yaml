language: python
diff_based_generation: true
max_iterations: 50
max_parallel_iterations: 1
checkpoint_interval: 5
max_solution_length: 40000
llm:
  api_base: https://api.openai.com/v1
  models:
    - name: gpt-5
      weight: 1.0
  max_tokens: 16384
  timeout: 300
prompt:
  system_message: |
    Improve a program for the published pressure-vessel design optimization
    problem. Implement solve(payload), returning the JSON-compatible list
    [shell_thickness, head_thickness, inner_radius, cylindrical_length].
    All four variables are measured in inches. The same fixed published
    instance is evaluated each time; there are no hidden instances.

    Minimize fabrication cost:
      0.6224*d1*r*L + 1.7781*d2*r**2 + 3.1661*d1**2*L + 19.84*d1**2*r.
    Both thicknesses d1,d2 must be integer multiples of 0.0625, with integer
    indices from 1 through 99. Bounds are 10 <= r <= 200 and 10 <= L <= 200.
    The remaining constraints are:
      -d1 + 0.0193*r <= 0
      -d2 + 0.00954*r <= 0
      -pi*r**2*L - 4*pi*r**3/3 + 1296000 <= 0
      L - 240 <= 0.
    These bounds and coefficients are supplied in payload. Do not replace
    the integer-thickness problem with its continuous relaxation.

    The evaluator independently checks the returned design and computes cost.
    Valid solutions receive a bounded score increasing as cost decreases.
    Infeasible, non-finite or malformed designs receive zero. Constraint
    tolerance is 1e-9 (volume residual divided by 1296000, other continuous
    residuals in inches); thickness-index integrality tolerance is 1e-9.
    Return ordinary Python lists and numbers; booleans are not numbers here.
    The candidate has 30 seconds, one numerical-library thread, and 2 GiB
    memory. Keep the solve signature and EVOLVE-BLOCK markers. Compute from
    the task data; do not read evaluator, reference, or oracle files.
evaluator:
  timeout: 90
  cascade_evaluation: false
  inject_evaluator_context: false
  final_evaluation: false
