# SimpleTES hadamard_maximal_det/hadamard_maximal_det_29 — ported verbatim from https://github.com/wq-will/SimpleTES (datasets/hadamard_maximal_det/hadamard_maximal_det_29)
# Usage: skydiscover-run benchmarks/simpletes/datasets/hadamard_maximal_det/hadamard_maximal_det_29/initial_program.py benchmarks/simpletes/datasets/hadamard_maximal_det/hadamard_maximal_det_29/skydiscover_evaluator.py -c benchmarks/simpletes/datasets/hadamard_maximal_det/hadamard_maximal_det_29/config.yaml -s <strategy>
# prompt.system_message is the upstream hadamard_maximal_det_29.txt byte-for-byte; see benchmarks/simpletes/README.md.
language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  models:
    - name: "gpt-5"
      weight: 1.0
  max_tokens: 32000
  timeout: 600
prompt:
  system_message: |
    Find an n×n matrix H with elements equal to 1 or −1 of size 29 to maximize |det(H)|.

    Do this by evolving the code between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END.

    The time limit for each program evaluation is 350 seconds.
evaluator:
  timeout: 450
  max_retries: 1
  cascade_evaluation: false
