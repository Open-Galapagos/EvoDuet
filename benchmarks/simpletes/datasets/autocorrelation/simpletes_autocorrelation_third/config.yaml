# SimpleTES autocorrelation/autocorrelation_third — ported verbatim from https://github.com/wq-will/SimpleTES (datasets/autocorrelation/autocorrelation_third)
# Usage: skydiscover-run benchmarks/simpletes/datasets/autocorrelation/simpletes_autocorrelation_third/initial_program.py benchmarks/simpletes/datasets/autocorrelation/simpletes_autocorrelation_third/skydiscover_evaluator.py -c benchmarks/simpletes/datasets/autocorrelation/simpletes_autocorrelation_third/config.yaml -s <strategy>
# prompt.system_message is the upstream autocorrelation_third.txt byte-for-byte; see benchmarks/simpletes/README.md.
language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  models:
    - name: "gpt-5"
      weight: 1.0
  max_tokens: 32000
  timeout: 600
prompt:
  system_message: |
    Design a Python program that constructs a discrete function `f: R -> R` on the domain `[-1/4, 1/4]` to minimize
    `C3 = 2·n·max(|conv(f,f)|) / (∑f)²`, aiming to beat the SOTA of `1.4556427953745406`.

    Do this by evolving the code between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END.

    The time limit for each program evaluation is 70 seconds.
evaluator:
  timeout: 150
  max_retries: 1
  cascade_evaluation: false
