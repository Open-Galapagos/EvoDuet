# SimpleTES autocorrelation/autocorrelation_second — ported verbatim from https://github.com/wq-will/SimpleTES (datasets/autocorrelation/autocorrelation_second)
# Usage: skydiscover-run benchmarks/simpletes/datasets/autocorrelation/simpletes_autocorrelation_second/initial_program.py benchmarks/simpletes/datasets/autocorrelation/simpletes_autocorrelation_second/skydiscover_evaluator.py -c benchmarks/simpletes/datasets/autocorrelation/simpletes_autocorrelation_second/config.yaml -s <strategy>
# prompt.system_message is the upstream autocorrelation_second.txt byte-for-byte; see benchmarks/simpletes/README.md.
language: python
diff_based_generation: true
max_iterations: 100
checkpoint_interval: 10
max_solution_length: 60000
llm:
  api_base: https://api.openai.com/v1
  models:
    - name: "gpt-5"
      weight: 1.0
  max_tokens: 32000
  timeout: 600
prompt:
  system_message: |
    Construct a non-negative function f on [-1/4, 1/4] to maximize

    R(f) = ‖f * f‖₂² / (‖f * f‖₁ · ‖f * f‖∞), with C₂ ≥ R(f) and target R(f) > 0.97.

    Do this by evolving the code between # EVOLVE-BLOCK-START and # EVOLVE-BLOCK-END.

    The time limit for each program evaluation is 1100 seconds.
evaluator:
  timeout: 1230
  max_retries: 1
  cascade_evaluation: false
