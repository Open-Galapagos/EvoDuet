<svg xmlns="http://www.w3.org/2000/svg" width="800" height="246" viewBox="0 0 800 246" role="img" aria-labelledby="title desc">
<title id="title">EvoDuet: bi-level co-evolution of solutions and web-search queries</title>
<desc id="desc">Solutions guide web-search queries, which retrieve evidence from arXiv, GitHub code, and web documents over three rounds. Selected evidence flows back to improve the solutions. Each box grows once per cycle.</desc>
<defs><linearGradient id="coupling"><stop stop-color="#7A5FC4"/><stop offset="1" stop-color="#3F78C0"/></linearGradient></defs>
<rect width="800" height="246" fill="#FFFFFF"/>
