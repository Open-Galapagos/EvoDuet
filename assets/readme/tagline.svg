</g>
<g data-flow="selected-evidence">
<path d="M 504.000 152.000 C 504.000 214.000 202.000 214.000 202.000 155.000 M 199.200 160.000 L 202.000 155.000 L 204.800 160.000" fill="none" stroke="url(#coupling)" stroke-width="2.0" opacity="0.4000" stroke-linecap="round" stroke-linejoin="round"/>
</g>
