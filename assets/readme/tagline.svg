<rect x="348" y="20" width="80" height="34" rx="8" fill="#f4f6fa"/>
<g transform="translate(358.000 37.000) scale(0.8000)" fill="none" stroke="#697386" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
