<path d="M 6 -5 L 1 0 L 6 5 M 14 -5 L 19 0 L 14 5 M 12 -7 L 8 7"/>
</g>
</g>
<g opacity="1.0000">
<rect x="307.559" y="142.201" width="28" height="26" rx="6" fill="#FFFFFF"/>
<rect x="309.559" y="144.201" width="24" height="22" rx="5" fill="#4575c0"/>
<g transform="translate(313.559 155.201) scale(0.8000)" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
